<!DOCTYPE html>
<html lang="zh-Hant-HK"><head><meta charset="UTF-8"><meta name="robots" content="noindex">
<title>股災指數 診斷頁（唔係正式版）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>body{background:#111;color:#eee;font-family:monospace;padding:16px} #log{white-space:pre-wrap} #chart,#chart2,#vchart,#vchart2{width:800px;height:400px}</style>
</head><body>
<h1>診斷頁（臨時，捉 JS 錯誤用）</h1>
<pre id="log">DIAG LOADING...
</pre>
<div id="chart"></div><div id="chart2"></div><div id="vchart"></div><div id="vchart2"></div>
<div id="nowNum"></div>
<div id="nowBadge"></div>

<div id="viewDesc"></div>
<div id="tabSix"></div>
<div id="tabVal"></div>

<div id="legsDesc"></div>

<div id="triggers"></div>
<div id="vulnNum"></div>
<div id="trigNum"></div>
<div id="alertBadge"></div>
<div id="trigNote"></div>
<div id="vScoreNum"></div>
<div id="vStructNum"></div>
<div id="vBadge"></div>
<div id="vnums"></div>
<div id="vInterp"></div>
<div id="vchart"></div>

<div id="panicLabel"></div>

<div id="panicRule"></div>

<div id="matrixDetail"></div>

<div id="tradeDetail"></div>

<div id="lbWinners"></div>
<div id="lbLosers"></div>

<script>
const LEG_META = {
  valuation:{n:'估值', l:'Wilshire 5000 ÷ GDP，愈貴愈危險'},
  curve:{n:'曲線', l:'10年−2年利差倒掛＝危險'},
  credit:{n:'信用', l:"Moody's Baa−Aaa 利差擴＝市場驚"},
  fear:{n:'恐慌', l:'VIX 愈高愈恐慌'},
  labor:{n:'勞動', l:'Sahm rule：失業率轉弱'},
  policy:{n:'政策', l:'聯邦基金利率愈高愈緊'}
};
const RECESS = [['1990-07','1991-03'],['2001-03','2001-11'],['2007-12','2009-06'],['2020-02','2020-04']];
const MARKS = {'2000-03':'科網頂','2007-10':'海嘯前頂','2020-02':'疫情前頂','2021-12':'2022熊市前頂'};
const PEAK_SIX = {'2000-03':58,'2007-10':51,'2020-02':62,'2021-12':51};
const PEAK_VAL = {'2000-03':74,'2007-10':52,'2020-02':61,'2021-12':75};
let VIEW='six', DD=null, chart=null, vchart=null;

function badgeFor(v){ return v>=65?['高危','badge b-red']:v>=55?['偏高','badge b-yellow']:['中性','badge b-green']; }
function viewNow(){ return VIEW==='six' ? DD.now : DD.monthly[DD.monthly.length-1].val; }

function setView(v){
  VIEW=v;
  document.getElementById('tabSix').className='tab'+(v==='six'?' active':'');
  document.getElementById('tabVal').className='tab'+(v==='val'?' active':'');
  if(!DD) return;
  renderHero(); renderLegs(); renderChart();
}

function renderHero(){
  const now=viewNow();
  document.getElementById('nowNum').textContent=now.toFixed(0);
  const t=badgeFor(now), b=document.getElementById('nowBadge');
  b.textContent=t[0]; b.className=t[1];
  document.getElementById('asof').textContent='數據截至 '+DD.asof+' · 每日更新';
  document.getElementById('viewDesc').textContent = VIEW==='six'
    ? '六條腿等權合成：估值、曲線、信用、恐慌、勞動、政策'
    : '單腿：估值（Wilshire 5000 ÷ GDP）｜好嘅溫度計，垃圾嘅時鐘';
}

function legCard(k){
  const z=DD.legs[k], m=LEG_META[k];
  const pct=Math.min(Math.abs(z)/3*50,50), col=z>=0?'#f87171':'#4ade80', side=z>=0?'left:50%':'right:50%';
  return `<div class="leg"><h3>${m.n}</h3><div class="logic">${m.l}</div>
    <div class="zv" style="color:${col}">${z>=0?'+':''}${z.toFixed(2)}σ</div>
    <div class="bar"><i style="${side};width:${pct}%;background:${col}"></i><i style="left:50%;width:1px;background:#555"></i></div></div>`;
}

function renderLegs(){
  const el=document.getElementById('legs');
  if(VIEW==='six'){
    document.getElementById('legsTitle').textContent='今日六條腿';
    document.getElementById('legsDesc').textContent='每條腿係過去 10 年滾動 z-score：正數＝比歷史偏危險，負數＝偏安全。';
    el.className='legs';
    el.innerHTML=Object.keys(LEG_META).map(legCard).join('');
  } else {
    document.getElementById('legsTitle').textContent='純估值版：得一條腿';
    document.getElementById('legsDesc').textContent='淨係睇估值（Wilshire 5000 ÷ GDP，過去 10 年滾動 z-score）。';
    const z=DD.legs.valuation, now=viewNow(), t=badgeFor(now);
    el.className='';
    el.innerHTML=`<div class="valcard"><h3>估值腿</h3>
      <p style="color:var(--mut);font-size:13px;margin:6px 0 12px">Wilshire 5000 ÷ GDP，愈貴愈危險</p>
      <div class="big">${z>=0?'+':''}${z.toFixed(2)}σ → 指數 ${now.toFixed(0)}（${t[0]}）</div>
      <p style="margin-top:12px;font-size:14px">過去三十年，純估值版有 <b>55%</b> 時間高於 60。佢識話你知個市有幾貴、幾脆弱，但唔識話你知幾時跌——1995 年佢已經話危險，科網頂要 2000 年先嚟。用法：判斷脆弱度，唔係判斷時機。</p></div>`;
  }
}

function chartOption(){
  const isSix=VIEW==='six', peaks=isSix?PEAK_SIX:PEAK_VAL;
  const idx=DD.monthly.map(p=>[p.d, isSix?p.v:p.val]);
  const spx=DD.monthly.map(p=>[p.d, p.s]);
  return {
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', backgroundColor:'#1c1c1c', borderColor:'#c9a227', textStyle:{color:'#e8e8e8'},
      formatter:ps=>{ let h=ps[0].axisValue+'<br/>'; ps.forEach(p=>{ h+=p.marker+' '+p.seriesName+': <b>'+p.value[1]+'</b><br/>'; }); return h; }},
    legend:{textStyle:{color:'#9a9a9a'}, top:0},
    grid:{left:48,right:48,top:40,bottom:30},
    dataZoom:[{type:'inside'},{type:'slider', bottom:0, textStyle:{color:'#9a9a9a'}}],
    xAxis:{type:'category', data:DD.monthly.map(p=>p.d),
      axisLabel:{color:'#9a9a9a', formatter:v=>v.slice(0,4), interval:23}},
    yAxis:[
      {type:'value', min:30, max:85, name:isSix?'股災指數（六腿）':'純估值版', nameTextStyle:{color:'#9a9a9a'}, axisLabel:{color:'#c9a227'},
       splitLine:{lineStyle:{color:'#222'}}},
      {type:'log', name:'S&P 500', nameTextStyle:{color:'#9a9a9a'}, axisLabel:{color:'#7aa2cc'}, splitLine:{show:false}}
    ],
    series:[
      {name:isSix?'股災指數（六腿）':'純估值版', type:'line', data:idx, yAxisIndex:0, showSymbol:false,
       lineStyle:{color:'#c9a227', width:2}, emphasis:{focus:'series'},
       markLine:{silent:true, symbol:'none', label:{color:'#9a9a9a', formatter:'{c}'},
         lineStyle:{color:'#555', type:'dashed'},
         data:[{yAxis:50,label:{formatter:'50 中性'}},{yAxis:60,lineStyle:{color:'#a33',type:'dotted'},label:{formatter:'60 警戒',color:'#f87171'}}]},
       markArea:{silent:true, itemStyle:{color:'rgba(255,255,255,0.05)'},
         data:RECESS.map(r=>[{xAxis:r[0]},{xAxis:r[1]}])},
       markPoint:{symbol:'pin', symbolSize:46, itemStyle:{color:'#c9a227'},
         label:{color:'#0d0d0d', fontSize:10, formatter:p=>p.name+' '+p.value},
         data:Object.keys(MARKS).map(k=>({name:MARKS[k], value:peaks[k], coord:[k, peaks[k]]}))}},
      {name:'S&P 500', type:'line', data:spx, yAxisIndex:1, showSymbol:false,
       lineStyle:{color:'#5b7fa6', width:1.5, opacity:.9}}
    ]
  };
}

function renderChart(){
  if(!chart) chart=echarts.init(document.getElementById('chart'));
  chart.setOption(chartOption(), true);
  window.addEventListener('resize', ()=>chart.resize());
}

function renderTriggers(){
  const T=DD.triggers_data, box=document.getElementById('triggers');
  if(!T){ box.innerHTML='<p class="desc">觸發器數據載入中…</p>'; return; }
  document.getElementById('vulnNum').textContent=T.vulnerability!=null?Number(T.vulnerability).toFixed(1):'–';
  document.getElementById('trigNum').textContent=Number(T.trigger_score).toFixed(1)+' / 5';
  const ab=document.getElementById('alertBadge');
  ab.textContent=T.alert_emoji+' '+T.alert_level;
  ab.className='badge '+(T.alert_level==='高危'?'b-red':T.alert_level==='平靜'?'b-green':'b-yellow');
  box.innerHTML=T.triggers.map(t=>{
    const dot=t.status==null?'⚪':t.status>=1?'🔴':t.status>=0.5?'🟡':'🟢';
    const st=t.status==null?'未知':t.status>=1?'響緊':t.status>=0.5?'半響':'平靜';
    return `<div class="leg"><h3><span class="tlight">${dot}</span> ${t.name}</h3>`
      +`<div class="logic">${t.threshold}</div>`
      +`<div style="font-size:14px">${t.value}</div>`
      +`<div style="font-size:13px;color:var(--mut);margin-top:6px">${st}${t.note?' · '+t.note:''}</div></div>`;
  }).join('');
  document.getElementById('trigNote').textContent='數據截至 '+T.asof+' · 日頻更新 · 純研究教育，唔係投資建議。'
    +(T.unknown_count?'（'+T.unknown_count+'個觸發器數據缺失：'+T.unknown_ids.join('、')+'）':'');
}

function renderVlight(){
  const V=DD.vlight_data, box=document.getElementById('vnums');
  if(!V){ box.innerHTML='<p class="desc">V燈數據載入中…</p>'; return; }
  const sc=V.v_score;
  document.getElementById('vScoreNum').textContent=sc!=null?Number(sc).toFixed(1):'–';
  document.getElementById('vStructNum').textContent=(V.status_emoji||'')+' '+(V.ratio!=null?Number(V.ratio).toFixed(3):'–');
  const b=document.getElementById('vBadge');
  b.textContent=(V.status_emoji||'')+' '+(V.status_label||'');
  b.className='badge '+(V.status==='DEEP_BACKWARDATION'?'b-red':V.status==='BACKWARDATION'?'b-yellow':'b-green');
  const cards=[
    ['VIX 收市', V.vix!=null?Number(V.vix).toFixed(2):'–', 'knot：15→0／20→35／30→70／45→100'],
    ['VIX3M', V.vix3m!=null?Number(V.vix3m).toFixed(2):'–', '3個月期引申波幅'],
    ['VIX ÷ VIX3M', V.ratio!=null?Number(V.ratio).toFixed(3):'–', '>1.0 ＝ Backwardation（恐慌）']
  ];
  box.innerHTML=cards.map(c=>
    `<div class="leg"><h3>${c[0]}</h3><div class="zv">${c[1]}</div><div class="logic">${c[2]}</div></div>`).join('');
  document.getElementById('vInterp').textContent='截至 '+V.asof+' · '+V.interpretation;
  const el=document.getElementById('vchart');
  if(!vchart) vchart=echarts.init(el);
  vchart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', backgroundColor:'#1c1c1c', borderColor:'#c9a227', textStyle:{color:'#e8e8e8'},
      formatter:ps=>ps[0].axisValue+'<br/>VIX/VIX3M: <b>'+ps[0].value[1]+'</b>'},
    grid:{left:48,right:20,top:30,bottom:30},
    xAxis:{type:'category', data:V.daily.map(p=>p.d),
      axisLabel:{color:'#9a9a9a', formatter:v=>v.slice(0,7), interval:29}},
    yAxis:{type:'value', min:0.7, max:1.4, axisLabel:{color:'#9a9a9a'}, splitLine:{lineStyle:{color:'#222'}}},
    visualMap:{show:false, dimension:1, pieces:[{lt:1.0,color:'#4ade80'},{gte:1.0,color:'#f87171'}]},
    series:[{name:'VIX/VIX3M', type:'line', data:V.daily.map(p=>[p.d,p.r]), showSymbol:false, lineStyle:{width:2},
      markLine:{silent:true, symbol:'none', label:{color:'#9a9a9a', formatter:'1.0 Backwardation線'},
        lineStyle:{color:'#555', type:'dashed'}, data:[{yAxis:1.0}]}}]
  }, true);
  window.addEventListener('resize', ()=>vchart.resize());
}

/* ===== 恐慌撈底系統 ===== */
const TIERS = [
  {k:'T1', e:'🟡', name:'T1 第一層', trig:'SPX離63日高位 −10% 且 VIX＞30', amt:'$50K（2注）', hist:'+14.2%（12M平均）',
   detail:['最需要VIX確認嘅一層：唔filter得+10.8%／64%勝率，filter咗+14.2%／70%。','因為−10%可恐慌可陰跌，VIX話你知係邊隻。','加注：買入後63日內再跌10%，加$25K（每注限一次）。']},
  {k:'T2', e:'🟠', name:'T2 第二層', trig:'SPX離63日高位 −15%', amt:'$25K（1注）', hist:'+18.0%（12M平均）',
   detail:['跌到−15%，VIX多數已經高，唔使再filter。','兩三年先有一次。','加注規則同T1一樣。']},
  {k:'T3', e:'🔴', name:'T3 第三層', trig:'−20% 或 VIX＞40', amt:'$25K（1注）', hist:'+23.7%（12M平均）',
   detail:['極端恐慌：幾年先一次。','跌到−20%，VIX實爆——6次入面6次都係恐慌。','例子：2020-03-02，VIX 40，之後12個月+27.4%。']}
];
const CELLS = {
  'strong-low': {t:'強牛市', s:'SPX＞200DMA ＋ VIX＜20', d:'乖乖揸住，唔好估頂。超買＞15%之後12個月平均+17.4%——估頂賣一半係同 momentum 對賭。', ex:'例子：2017、2019、2024'},
  'strong-high': {t:'假跌', s:'SPX＞200DMA ＋ VIX≥20', d:'強勢中嘅恐慌，好快彈返。趨勢未壞，唔使驚。', ex:'例子：2018-02（VIX 33但SPX仲喺200DMA上）'},
  'weak-low': {t:'陰跌', s:'SPX＜200DMA ＋ VIX＜20', d:'最危險：唔恐慌、冇宣洩，跌完再跌。唔好撈！跌10%但VIX唔高，之後12個月平均得+0.6%。', ex:'例子：2000–2002、2022'},
  'weak-high': {t:'恐慌底', s:'SPX＜200DMA ＋ VIX≥20', d:'系統出動嘅時候！跌10%＋VIX＞30之後12個月平均+14.2%。分三層入，每注再跌10%加注。', ex:'例子：2008-10、2020-03'}
};
const TRADES = [
  {d:'2018-02-09', t:'T1', px:229, vix:33, dd:-10.1, r12:'+6.8%', note:'Volmageddon：VIX一日爆升，恐慌性拋售。'},
  {d:'2018-12-21', t:'T2', px:215, vix:28, dd:-15.3, r12:'+36.0%', note:'聖誕跌市：聯儲局加息＋政府停擺，市場恐慌。'},
  {d:'2018-12-24', t:'T1', px:209, vix:30, dd:-17.0, r12:'+39.7%', note:'平安夜絕對底部——冇系統，你敢喺平安夜買？'},
  {d:'2020-03-02', t:'T3', px:281, vix:40, dd:-12.4, r12:'+27.4%', note:'疫情爆發：VIX升穿40，中間再捱−24.8%（熔斷），但12個月後+27.4%。'}
];
const TIER_BADGE = {normal:['b-green','🟢 正常市'], T1:['b-yellow','🟡 T1 入場中'], T2:['b-yellow','🟠 T2 入場中'], T3:['b-red','🔴 T3 入場中'], unknown:['b-yellow','⚪ 數據缺失']};

function renderPanic(){
  const P = DD.panic_data;
  if(!P){ document.getElementById('panicLabel').textContent='載入中'; return; }
  document.getElementById('panicEmoji').textContent = P.tier_emoji || '⚪';
  const tb = TIER_BADGE[P.tier] || TIER_BADGE.unknown;
  const lbl = document.getElementById('panicLabel');
  lbl.innerHTML = `<span class="badge ${tb[0]}">${tb[1]}</span>`;
  document.getElementById('panicAsof').textContent = '數據截至 ' + P.asof + ' · 每日更新';
  document.getElementById('panicSpy').textContent = P.spy != null ? '$' + P.spy : '–';
  document.getElementById('panicDd').textContent = P.dd63 != null ? (P.dd63 > 0 ? '+' : '') + P.dd63 + '%' : '–';
  document.getElementById('panicVix').textContent = P.vix != null ? P.vix : '–';
  document.getElementById('panicRatio').textContent = P.ratio != null ? P.ratio : '–';
  const rule = document.getElementById('panicRule');
  if(P.tier === 'normal'){
    rule.textContent = '85%長揸唔郁，15%恐慌購物金等緊。下一觸發：T1（−10%且VIX＞30）。';
  } else {
    rule.innerHTML = '<b style="color:var(--gold2)">訊號響緊！</b>跟三層規則入場，買咗唔賣。';
  }
  // 三層卡
  document.getElementById('tiers').innerHTML = TIERS.map((t,i)=>`
    <div class="tier${P.tier===t.k?' active':''}" onclick="this.classList.toggle('open')">
      <div class="te">${t.e}</div><h3>${t.name}</h3><div class="trig">${t.trig}</div>
      <div class="detail"><ul>${t.detail.map(d=>`<li>${d}</li>`).join('')}</ul>
      <p style="margin-top:8px">動用：<b>${t.amt}</b>｜歷史：<b style="color:#4ade80">${t.hist}</b></p></div>
    </div>`).join('');
  // Regime 矩陣
  const rg = P.regime || {trend:'strong', vix:'low'};
  const cur = rg.trend + '-' + rg.vix;
  const order = [['strong-low','strong-high'],['weak-low','weak-high']];
  const axisT = {strong:'SPX強勢（＞200DMA）', weak:'SPX弱勢（＜200DMA）'};
  const axisV = {low:'VIX低（＜20）', high:'VIX高（≥20）'};
  document.getElementById('matrix').innerHTML = order.map(row => row.map(k=>{
    const c = CELLS[k], [tr, vx] = k.split('-');
    return `<div class="mcell${k===cur?' now':''}" onclick="showCell('${k}')">
      <h4>${c.t}</h4><div class="ms">${axisT[tr]}<br>${axisV[vx]}</div>
      ${k===cur?'<div><span class="nowtag">而家喺呢格</span></div>':''}</div>`;
  }).join('')).join('');
  showCell(cur);
  // 時間線
  document.getElementById('timeline').innerHTML = TRADES.map((t,i)=>`
    <div class="titem" onclick="showTrade(${i})">
      <div class="td">${t.d}</div><div class="tt">${t.t} @ $${t.px}</div>
      <div class="tr">${t.r12}</div><div class="ms" style="font-size:12px;color:var(--mut)">12個月回報（撳睇詳情）</div>
    </div>`).join('');
}
function showCell(k){
  const c = CELLS[k];
  const el = document.getElementById('matrixDetail');
  el.innerHTML = `<h4 style="font-size:16px;margin-bottom:6px">${c.t} <span style="color:var(--mut);font-weight:400;font-size:13px">${c.s}</span></h4><p>${c.d}</p><p style="margin-top:8px;color:var(--gold2)">${c.ex}</p>`;
  el.classList.add('show');
}
function showTrade(i){
  const t = TRADES[i];
  const el = document.getElementById('tradeDetail');
  el.innerHTML = `<h4 style="font-size:16px;margin-bottom:6px">${t.d} · ${t.t} @ $${t.px}</h4>
    <p>VIX ${t.vix}｜離63日高位 ${t.dd}%｜12個月後 <b style="color:#4ade80">${t.r12}</b></p>
    <p style="margin-top:8px;color:var(--gold2)">${t.note}</p>`;
  el.classList.add('show');
}
// 每日情報（intel_digest.py 產生，intel_feed.json）
const INTEL_TAG = {'大師動向':'itag-guru','Burry追蹤':'itag-burry','策略發現':'itag-strat','觸發器':'itag-trig'};
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderIntel(){
  const el = document.getElementById('intelFeed');
  const feed = DD.intel_data;
  if(!feed || !feed.length){ el.innerHTML = '<p class="desc">今日暫無新情報。</p>'; return; }
  const days = {};
  feed.forEach(e=>{ (days[e.date] = days[e.date] || []).push(e); });
  el.innerHTML = Object.keys(days).sort().reverse().map(d=>`
    <div class="intel-day">${escH(d)}</div>
    <div class="intel-grid">${days[d].map(e=>`
      <div class="intel">
        <span class="itag ${INTEL_TAG[e.tag]||''}">${escH(e.tag)}</span>
        <h4>${escH(e.title)}</h4>
        <p>${escH(e.summary)}</p>
        ${e.key_numbers && e.key_numbers.length ? `<div class="kn">🔑 ${e.key_numbers.map(escH).join(' · ')}</div>` : ''}
        ${e.link ? `<div class="src"><a href="${escH(e.link)}" target="_blank" rel="noopener">原文連結 ↗</a></div>` : ''}
      </div>`).join('')}</div>`).join('');
}

// 策略龍虎榜（build_leaderboard_json.py 由龍虎榜 MD 解析產生）
function lbColor(v){
  v = v || '';
  if(v.indexOf('無證據') >= 0) return 'lb-v-red';
  if(v.indexOf('未證實') >= 0 || v.indexOf('數據不足') >= 0) return 'lb-v-grey';
  if(v.indexOf('有效') >= 0) return 'lb-v-green';
  return 'lb-v-yellow';
}
function renderLeaderboard(){
  const L = DD.leaderboard_data;
  if(!L){ document.getElementById('lbMethod').textContent='龍虎榜數據載入中…'; return; }
  document.getElementById('lbMethod').textContent =
    '龍虎榜 ' + L.version + ' · 截至 ' + L.asof + ' · ' + L.method +
    ' 榜上有名 ' + L.counts.winners + ' 條，打假 ' + L.counts.losers + ' 條。' + L.queue_note;
  document.getElementById('lbWinners').innerHTML =
    '<tr><th>策略</th><th>分類</th><th>回測期</th><th>關鍵數字</th><th>Verdict</th></tr>' +
    L.winners.map(w=>'<tr><td>' + escH(w.name) + '</td><td>' + escH(w.cat) + '</td><td>' + escH(w.period) +
      '</td><td>' + escH(w.key) + '</td><td><span class="lb-verdict ' + lbColor(w.verdict) + '">' + escH(w.verdict) + '</span></td></tr>').join('');
  document.getElementById('lbLosers').innerHTML =
    '<tr><th>策略／聲稱</th><th>關鍵數字</th><th>Verdict</th></tr>' +
    L.losers.map(w=>'<tr><td>' + escH(w.name) + '</td><td>' + escH(w.key) +
      '</td><td><span class="lb-verdict ' + lbColor(w.verdict) + '">' + escH(w.verdict) + '</span></td></tr>').join('');
  document.getElementById('lbNotes').innerHTML = [L.panic, L.live_window].map(n=>
    '<div class="valcard" style="margin-bottom:12px"><h3>' + escH(n.name) + '</h3>' +
    '<p style="margin-top:8px;font-size:14px">' + escH(n.key) + '</p>' +
    '<p style="margin-top:8px;font-size:14px;color:var(--gold2)">' + escH(n.note) + '</p></div>').join('');
  document.getElementById('lbDisclaimer').textContent = L.disclaimer;
}

// ===== 診斷 driver：逐段試，捉實邊行拋錯 =====
const logEl = document.getElementById('log');
function dlog(){ logEl.textContent += Array.prototype.join.call(arguments, ' ') + '\n'; }
dlog('DIAG START ' + new Date().toISOString());
dlog('UA: ' + navigator.userAgent);
dlog('echarts: ' + (typeof echarts) + (typeof echarts !== 'undefined' ? (' version=' + echarts.version) : ''));
fetch('data.json').then(function(r){ dlog('fetch status: ' + r.status); return r.json(); }).then(function(D){
  DD = D;
  dlog('data ok: asof=' + D.asof + ' now=' + D.now + ' monthly=' + D.monthly.length + ' intel=' + (D.intel_data||[]).length + ' lbW=' + ((D.leaderboard_data||{}).winners||[]).length);
  var steps = [
    ['renderHero', function(){ renderHero(); }],
    ['renderLegs', function(){ renderLegs(); }],
    ['renderTriggers', function(){ renderTriggers(); }],
    ['renderVlight', function(){ renderVlight(); }],
    ['renderPanic', function(){ renderPanic(); }],
    ['renderIntel', function(){ renderIntel(); }],
    ['renderLeaderboard', function(){ renderLeaderboard(); }],
    ['renderChart', function(){ renderChart(); }]
  ];
  steps.forEach(function(s){
    try { s[1](); dlog('STEP ' + s[0] + ': OK'); }
    catch(e){ dlog('STEP ' + s[0] + ': FAIL: ' + e.name + ': ' + e.message); dlog('  stack: ' + String(e.stack || '').slice(0, 800)); }
  });
  // 隔離重試：vchart 同主圖各自再試一次 setOption，睇下係咪佢哋拋錯
  try {
    var vc2 = echarts.init(document.getElementById('vchart2'));
    vc2.setOption({ backgroundColor:'transparent',
      xAxis:{type:'category', data: DD.vlight_data.daily.map(function(p){return p.d;})},
      yAxis:{type:'value', min:0.7, max:1.4},
      series:[{type:'line', data: DD.vlight_data.daily.map(function(p){return [p.d,p.r];})}] }, true);
    dlog('ISOLATED vchart setOption: OK');
  } catch(e){ dlog('ISOLATED vchart setOption: FAIL: ' + e.name + ': ' + e.message); dlog('  stack: ' + String(e.stack || '').slice(0, 800)); }
  try {
    var c2 = echarts.init(document.getElementById('chart2'));
    c2.setOption(chartOption(), true);
    dlog('ISOLATED main chart setOption: OK');
  } catch(e){ dlog('ISOLATED main chart setOption: FAIL: ' + e.name + ': ' + e.message); dlog('  stack: ' + String(e.stack || '').slice(0, 800)); }
  dlog('nowNum=' + JSON.stringify(document.getElementById('nowNum').textContent));
  dlog('panicSpy=' + JSON.stringify(document.getElementById('panicSpy').textContent));
  dlog('intelFeed len=' + document.getElementById('intelFeed').innerHTML.length);
  dlog('lbWinners rows=' + document.getElementById('lbWinners').innerHTML.length);
  dlog('DIAG DONE');
}).catch(function(e){ dlog('FETCH FAIL: ' + e.name + ': ' + e.message); dlog('DIAG DONE'); });

</script>
</body></html>
