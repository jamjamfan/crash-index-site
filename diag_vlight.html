<!DOCTYPE html>
<html lang="zh-Hant-HK"><head><meta charset="UTF-8"><meta name="robots" content="noindex">
<title>V 燈 option 測試（臨時）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>body{background:#111;color:#eee;font-family:monospace;padding:16px} #log{white-space:pre-wrap} .t{width:800px;height:300px;border:1px solid #333;margin:8px 0}</style>
</head><body>
<h1>V 燈 option 測試（臨時，捉 visualMap / markLine 邊個出事）</h1>
<pre id="log">TEST LOADING...
</pre>
<h2>V0 原樣（visualMap + markLine）</h2><div class="t" id="t0"></div>
<h2>V1 去 visualMap，留 markLine</h2><div class="t" id="t1"></div>
<h2>V2 留 visualMap，去 markLine</h2><div class="t" id="t2"></div>
<h2>V3 visualMap + markLine 用 explicit coord</h2><div class="t" id="t3"></div>
<h2>V4 淨線（陽性對照，預期 OK）</h2><div class="t" id="t4"></div>
<script>
const logEl = document.getElementById('log');
function dlog(){ logEl.textContent += Array.prototype.join.call(arguments, ' ') + '\n'; }
dlog('TEST START ' + new Date().toISOString());
dlog('echarts: ' + (typeof echarts) + (typeof echarts !== 'undefined' ? (' version=' + echarts.version) : ''));
function baseOpt(V){
  return {
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', backgroundColor:'#1c1c1c', borderColor:'#c9a227', textStyle:{color:'#e8e8e8'},
      formatter:ps=>ps[0].axisValue+'<br/>VIX/VIX3M: <b>'+ps[0].value[1]+'</b>'},
    grid:{left:48,right:20,top:30,bottom:30},
    xAxis:{type:'category', data:V.daily.map(p=>p.d),
      axisLabel:{color:'#9a9a9a', formatter:v=>v.slice(0,7), interval:29}},
    yAxis:{type:'value', min:0.7, max:1.4, axisLabel:{color:'#9a9a9a'}, splitLine:{lineStyle:{color:'#222'}}},
    series:[{name:'VIX/VIX3M', type:'line', data:V.daily.map(p=>[p.d,p.r]), showSymbol:false, lineStyle:{width:2}}]
  };
}
function tryVariant(id, opt){
  try {
    const c = echarts.init(document.getElementById(id));
    c.setOption(opt, true);
    dlog('VARIANT ' + id + ': OK (setOption 冇拋錯)');
    return true;
  } catch(e){
    dlog('VARIANT ' + id + ': FAIL: ' + e.name + ': ' + e.message);
    return false;
  }
}
fetch('data.json').then(function(r){ dlog('fetch status: ' + r.status); return r.json(); }).then(function(D){
  const V = D.vlight_data;
  dlog('data ok: vlight asof=' + V.asof + ' daily=' + V.daily.length + ' first=' + V.daily[0].d + ' last=' + V.daily[V.daily.length-1].d);
  // V0: 原樣
  const o0 = baseOpt(V);
  o0.visualMap = {show:false, dimension:1, pieces:[{lt:1.0,color:'#4ade80'},{gte:1.0,color:'#f87171'}]};
  o0.series[0].markLine = {silent:true, symbol:'none', label:{color:'#9a9a9a', formatter:'1.0 Backwardation線'},
    lineStyle:{color:'#555', type:'dashed'}, data:[{yAxis:1.0}]};
  tryVariant('t0', o0);
  // V1: 去 visualMap
  const o1 = baseOpt(V);
  o1.series[0].markLine = {silent:true, symbol:'none', label:{color:'#9a9a9a', formatter:'1.0 Backwardation線'},
    lineStyle:{color:'#555', type:'dashed'}, data:[{yAxis:1.0}]};
  tryVariant('t1', o1);
  // V2: 去 markLine
  const o2 = baseOpt(V);
  o2.visualMap = {show:false, dimension:1, pieces:[{lt:1.0,color:'#4ade80'},{gte:1.0,color:'#f87171'}]};
  tryVariant('t2', o2);
  // V3: visualMap + markLine 用 explicit coord
  const o3 = baseOpt(V);
  o3.visualMap = {show:false, dimension:1, pieces:[{lt:1.0,color:'#4ade80'},{gte:1.0,color:'#f87171'}]};
  o3.series[0].markLine = {silent:true, symbol:'none', label:{color:'#9a9a9a', formatter:'1.0 Backwardation線'},
    lineStyle:{color:'#555', type:'dashed'},
    data:[[{coord:[V.daily[0].d, 1.0]}, {coord:[V.daily[V.daily.length-1].d, 1.0]}]]};
  tryVariant('t3', o3);
  // V4: 淨線
  tryVariant('t4', baseOpt(V));
  dlog('TEST DONE');
}).catch(function(e){ dlog('FETCH FAIL: ' + e.name + ': ' + e.message); dlog('TEST DONE'); });
</script>
</body></html>
